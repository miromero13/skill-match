services:
  db:
    image: postgres:16-alpine
    container_name: skillmatch-db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-skillmatch}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-skillmatch}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - skillmatch-network

  redis:
    image: redis:7-alpine
    container_name: skillmatch-redis
    restart: always
    command: redis-server --appendonly yes
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - skillmatch-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      additional_contexts:
        ml: ./ml
    container_name: skillmatch-backend
    restart: always
    env_file:
      - ./backend/.env
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      REDIS_URL: redis://redis:6379/0
    volumes:
      - ./backend/firebase-credentials.json:/app/firebase-credentials.json:ro
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    expose:
      - "8000"
    networks:
      - skillmatch-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: runtime
      args:
        VITE_API_URL: ${VITE_API_URL:-https://skillmatch-app.southafricanorth.cloudapp.azure.com/api}
    container_name: skillmatch-frontend
    restart: always
    expose:
      - "8080"
    depends_on:
      - backend
    networks:
      - skillmatch-network

  caddy:
    image: caddy:2-alpine
    container_name: skillmatch-caddy
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    command: caddy reverse-proxy --from skillmatch-app.southafricanorth.cloudapp.azure.com --to frontend:8080
    depends_on:
      - frontend
    networks:
      - skillmatch-network

volumes:
  pgdata:
  redisdata:
  caddy_data:
  caddy_config:

networks:
  skillmatch-network:
    driver: bridge
