[project]
name = "skillmatch-backend"
version = "0.1.0"
description = "Backend REST API para SkillMatch - Plataforma de intercambio de habilidades con IA y confianza algorítmica"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic[email]>=2.10.0",
    "email-validator>=2.2.0",
    "pydantic-settings>=2.6.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "python-multipart>=0.0.17",
    "httpx>=0.28.0",
    "celery>=5.4.0",
    "redis>=5.2.0",
    "pywebpush>=2.5.0",
    "boto3>=1.35.0",
    "pyyaml>=6.0.2",
    "numpy>=1.26.0",
    "scipy>=1.14.0",
    "opencv-python-headless>=4.10.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "types-PyYAML>=6.0.12",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = [".", "..", "tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
markers = [
    "hu24: realtime notification WebSocket contract tests",
    "hu25: notification inbox and preferences acceptance tests, requiring local PostgreSQL",
    "hu16: acceptance tests for the HU-16 API, requiring migrated local PostgreSQL",
]
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.ruff]
line-length = 100
target-version = "py312"
