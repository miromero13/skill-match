# SkillMatch frontend — installed as /etc/nginx/conf.d/default.conf (included inside `http {}`).
#
# Single origin: serves the SPA and reverse-proxies /api/ and /ws/ to the backend container, so the backend is
# never published. FastAPI's /docs, /redoc and /openapi.json are never proxied.

# WebSocket upgrade: forward "Connection: upgrade" only when the client asked for it.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ""      close;
}

# Keep the scheme set by an outer TLS proxy (Coolify/Traefik); otherwise use ours.
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    absolute_redirect off;
    client_max_body_size 200m;

    # Docker embedded DNS + variable upstream: nginx starts even if `backend` is not up yet and
    # re-resolves it when the container is recreated (new IP).
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;
    set $backend_upstream http://backend:8000;

    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/manifest+json
        application/wasm
        application/xml
        image/svg+xml;

    include /etc/nginx/snippets/security-headers.conf;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # API documentation is never exposed through the public origin.
    location = /docs         { return 404; }
    location ^~ /docs/       { return 404; }
    location = /redoc        { return 404; }
    location = /openapi.json { return 404; }

    # REST API + football session WebSockets (/api/.../sessions/{id}/ws).
    location /api/ {
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        # nginx adds the security headers; drop the backend copies to avoid duplicates.
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header X-Frame-Options;
        proxy_request_buffering off;
        proxy_connect_timeout 10s;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Root WebSockets (/ws/notifications).
    location /ws/ {
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header X-Frame-Options;
        proxy_buffering off;
        proxy_connect_timeout 10s;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Content-hashed Vite bundles: cache forever; a missing asset is a 404, never index.html.
    location ^~ /assets/ {
        try_files $uri =404;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location = /service-worker.js {
        try_files $uri =404;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        add_header Service-Worker-Allowed "/" always;
    }

    # Also reached internally by `/` (index) and by the SPA fallback below.
    location = /index.html {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
    }

    # SPA client-side routes.
    location / {
        try_files $uri $uri/ /index.html;

        # Self-hosted MediaPipe runtime (public/mediapipe/wasm). Nested so it never shadows /api/ or /ws/.
        location ~* \.wasm$ {
            types { application/wasm wasm; }
            default_type application/wasm;
            try_files $uri =404;
        }
    }
}
