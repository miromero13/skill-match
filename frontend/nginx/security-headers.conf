# Installed as /etc/nginx/snippets/security-headers.conf.
# nginx does not inherit add_header into a location that defines its own add_header, so every such
# location includes this snippet again.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(self), microphone=(self)" always;
